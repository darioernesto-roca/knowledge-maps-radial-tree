<!DOCTYPE html>
<meta charset="utf-8">
<title>Knowledge Map</title>
<link rel="stylesheet" type="text/css" href="./inspector.css">
<body>
  <main class="page">
    <div class="top-header">
      <p class="app-title">Knowledge Map - Developed by <a href="https://rocadev.net/" target="_blank">RocaDev</a> - This is an Open Source Project - Here's the <a href="https://github.com/darioernesto-roca/knowledge-maps-radial-tree" target="_blank">link to the repository</a></p>
    </div>
    <div class="toolbar">
      <div id="topic-buttons" aria-label="Topic selector"></div>
      <div class="toolbar-actions">
        <div class="zoom-controls" role="group" aria-label="Map zoom controls">
          <button id="zoom-out" class="zoom-button" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-reset" class="zoom-button" type="button" aria-label="Reset zoom">Reset</button>
          <button id="zoom-in" class="zoom-button" type="button" aria-label="Zoom in">+</button>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">Dark mode</button>
      </div>
    </div>
    <h1 id="topic-title"></h1>
    <p id="topic-description"></p>
    <div id="chart-container"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
